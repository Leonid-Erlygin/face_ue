mode: toolbench_osr
seed: 777
output_dir: outputs/modern_ai/toolbench_g1_open_set_routing
kappa_grid_size: 64

data:
  prepared_dir: datasets/tool_routing/toolbench_g1
  calibration_split: val
  test_split: test

embedder:
  kind: repo_scf
  model_name: bert-base-uncased
  backbone_path: model_weights/backbone/bert_toolbench_arcface/backbone.pth
  scf_checkpoint_path: model_weights/text_models/trained_scf/toolbench.ckpt
  num_features: 768
  bottleneck_dim: 768
  proj_depth: 2
  scf_latent_dim: 512
  batch_size: 64
  max_length: 192
  cache_dir: .cache/modern_ai_embeddings/toolbench_scf

query_uncertainty:
  # SCF concentration is learned from the frozen ArcFace representation.
  source: embedder
  default_kappa: 300.0
  mean_mode: original
  rewrites_path: null
  # Fit one global multiplicative scale using only calibration-known queries and
  # their correct API descriptions. This corrects cross-API SCF concentration
  # bias before fitting gallery kappa, then remains frozen on the final test.
  concentration_calibration:
    strategy: vmf_nll_scale
    min_scale: 0.05
    max_scale: 20.0

posterior:
  beta: 0.5
  target_fpir: 0.10
  gallery_prior: power
  predict_T: 200.0
  mc_samples: 0
  gallery_kappa: null
  # Fixed ToolBench gallery -> use the dissertation's boundary-root calibration.
  gallery_kappa_strategy: boundary_roots_calibrated
  kappa_low: 10.0
  kappa_high: 1000000.0
  kappa_grid_size: 512

reporting:
  enabled: true
  rejection_fractions: [0.0, 0.5, 20]
  display_random_curve: true
  display_oracle_curve: true
  prr_in_legend: true
  figsize: [6.4, 4.8]
  legend_fontsize: 8
  round_num: 3
  highlight_best: true
