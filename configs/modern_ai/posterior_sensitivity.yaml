mode: posterior_sensitivity
seed: 777
calibration_fraction: 0.30
output_dir: outputs/modern_ai/posterior_sensitivity

data:
  loader: beir
  path: data/beir/scifact
  split: test
  name: scifact
protocol:
  kind: evidence_deletion
  unknown_fraction: 0.30
  seed: 777
embedder:
  kind: sentence_transformer
  model_name: BAAI/bge-base-en-v1.5
  batch_size: 64
  cache_dir: .cache/modern_ai_embeddings/bge-base-en-v1.5
query_uncertainty:
  default_kappa: 300.0
  mean_mode: original
  rewrites_path: null
posterior:
  beta: 0.5
  target_fpir: 0.10
  gallery_prior: power
  predict_T: 200.0
  mc_samples: 0
  lambda_fa: 1.0
  lambda_id: 1.0
  lambda_fr: 1.0
  lambda_ns: 1.0

# One-factor-at-a-time main-effects audit. Pure cost sweeps freeze the baseline
# gallery concentration; beta/target-FPIR sweeps re-identify it on calibration.
sweeps:
  beta: [0.10, 0.25, 0.50, 0.75, 0.90]
  target_fpir: [0.01, 0.05, 0.10, 0.20]
  lambda_fa: [0.25, 1.0, 4.0]
  lambda_id: [0.25, 1.0, 4.0]
  lambda_fr: [0.25, 1.0, 4.0]
  lambda_ns: [0.0, 0.25, 1.0, 4.0]
