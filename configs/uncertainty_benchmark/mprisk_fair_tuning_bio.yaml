hydra:
  run:
    dir: ${exp_dir}

seed: 777
deterministic: true
recompute_template_pooling: False
exp_dir: outputs/experiments/mprisk_fair_tuning_bio

# This config is loaded by the script to reuse datasets/method definitions.
core_config_path: /app/configs/uncertainty_benchmark/mprisk_core_bio_complete.yaml

rejection_fractions: [0.0, 0.5, 20]

datasets:
  - IJBC
  - IJBB
  - whale
  - large_12k-perspk5

# For final paper, use representative points first.
# You can later extend to [0.01, 0.05, 0.1, 0.2].
far_list: [0.01, 0.05, 0.1, 0.2]

beta_list: [0.5]

mprisk_method_name: "MPRisk"

simple_methods:
  - SCF
  - AccScr
  - MSP
  - Margin

lambda_search:
  num_random: 4096
  log_low: -10.0
  log_high: 10.0

linear_search:
  num_random: 4096
  log_low: -10.0
  log_high: 10.0




# Comprehensive for tables.

lambda_stability:
  enabled: True
  fars: [0.05]
  validation_fractions: [0.01, 0.05, 0.10, 0.25, 0.50, 1.0]
  repeats: 5
  min_subset_size: 100

approximation_check:
  enabled: True

  # Run approximation check only at representative operating point.
  fars: [0.1]

  # Conservative batching for MC posterior computation.
  prob_batch_size: 32
  max_prob_elements: 2000000

  # Set to 16 for quick run, 32 for final if memory/time allows.
  max_M: 32

  variants:
    - name: "mean_analytic_M0"
      recognition_method:
        M: 0
        nonspecificity_mode: analytic_vmf
        prob_batch_size: 256
        max_prob_elements: 8000000

    - name: "mc_M8_analytic"
      recognition_method:
        M: 8
        nonspecificity_mode: analytic_vmf
        prob_batch_size: 64
        max_prob_elements: 2000000

    - name: "mc_M16_analytic"
      recognition_method:
        M: 16
        nonspecificity_mode: analytic_vmf
        prob_batch_size: 32
        max_prob_elements: 2000000

    - name: "mc_M32_analytic"
      recognition_method:
        M: 32
        nonspecificity_mode: analytic_vmf
        prob_batch_size: 16
        max_prob_elements: 1000000

    - name: "mc_M16_weighted_n0"
      recognition_method:
        M: 16
        nonspecificity_mode: weighted_mc
        prob_batch_size: 32
        max_prob_elements: 2000000

    - name: "mc_M32_weighted_n0"
      recognition_method:
        M: 32
        nonspecificity_mode: weighted_mc
        prob_batch_size: 16
        max_prob_elements: 1000000