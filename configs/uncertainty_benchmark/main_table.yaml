hydra:
  run:
    dir: ${exp_dir}
seed: 777
deterministic: true

exp_dir: outputs/experiments/filter
use_two_galleries: False
recompute_template_pooling: True
metric_pretty_name_path: /app/configs/latex_tables/pretty_names/column_pretty_name.yaml
create_pool_plot: False

test_datasets:
  - _target_: evaluation.test_datasets.FaceRecogntionDataset
    dataset_name: IJBC
    dataset_path: /app/datasets/arcface_ijb/IJBC

  - _target_: evaluation.test_datasets.FaceRecogntionDataset
    dataset_name: IJBB
    dataset_path: /app/datasets/arcface_ijb/IJBB

  - _target_: evaluation.test_datasets.FaceRecogntionDataset
    dataset_name: large_12k-perspk5
    dataset_path: /app/datasets/vb-clean_ident/Large_12k/perspk5

  - _target_: evaluation.test_datasets.FaceRecogntionDataset
    dataset_name: whale
    dataset_path: /app/datasets/whale


dataset_name_to_calibration_set:
  IJBB: ${calibration_sets.ijb_val}
  IJBC: ${calibration_sets.ijb_val}
  whale: ${calibration_sets.whale_val}
  large_12k-perspk5: ${calibration_sets.voxblink_val} 
dataset_name_to_T_scale:
  IJBB: 7
  IJBC: 7
  whale: 20
  large_12k-perspk5: 20

calibration_sets:
  ijb_val:
    _target_: evaluation.test_datasets.FaceRecogntionDataset
    dataset_name: ms1m
    dataset_path: /app/datasets/ms1m_ident
  voxblink_val:
    _target_: evaluation.test_datasets.FaceRecogntionDataset
    dataset_name: medium_1.2k-perspk5
    dataset_path: /app/datasets/vb-clean_ident/Medium_1.2k/perspk5
  whale_val:
    _target_: evaluation.test_datasets.FaceRecogntionDataset
    dataset_name: whale_val
    dataset_path: /app/datasets/whale_val



open_set_identification_metrics:
  - _target_: evaluation.metrics.ErrorDistribution
    plot_save_dir: ${exp_dir}
    value_types: [0, 1, 2, 3, 4, 5]
  - _target_: evaluation.metrics.FnirFpir

fractions: [0, 0.5, 20]

open_set_identification_uncertainty_metrics:
  - _target_: evaluation.uncertainty_metrics.DisposeBasedOnUnc
    fractions: ${fractions}
    metric_to_monitor:
      _target_: evaluation.metrics.FrrFarIdent
  
  - _target_: evaluation.uncertainty_metrics.DisposeBasedOnUnc
    fractions: ${fractions}
    metric_to_monitor:
      _target_: evaluation.metrics.FnirFpir

  - _target_: evaluation.uncertainty_metrics.DisposeBasedOnUnc
    fractions: ${fractions}
    metric_to_monitor:
      _target_: evaluation.metrics.F1_classic

beta_list: [0.5]
far_list: [0.01, 0.05, 0.1, 0.2]
display_oracle_curve: True

