  - embeddings: scf
    gallery_template_pooling_strategy:
      _target_: evaluation.template_pooling_strategies.PoolingDefault  
    probe_template_pooling_strategy:
      _target_: evaluation.template_pooling_strategies.PoolingDefault
    recognition_method:
      _target_: evaluation.open_set_methods.class_prob_models.MonteCarloPredictiveProb
      gallery_prior: power
      emb_unc_model: vMF
      beta: 0.5
      alpha: 0.5
      predict_T: 20
      pred_uncertainty_type: entropy
      far: null
      train_predict_T: False #True
      predict_T_lr: 1e-2
      calibration_set: True
      calibration_embs_name: scf
      calibration_transform:
        _target_: evaluation.open_set_methods.calibration_methods.NNcalibration
        model:
          _target_: evaluation.open_set_methods.calibration_methods.MLP
          hidden_size: 6 # 10
          num_layers: 3 #4 # 3
          use_bn: False
        lr: 0.001
        epochs: 2000
        weight: 0.5
        use_norm: True
        train_weight: False
        balanced_loss: True
        weight_loss_types: False
        weight_decay: 0.1
        normalize_kl_by_test: False 
        scheduler_params: 
          max_lr: 1e-3
          steps_per_epoch: 1
          div_factor: 1e1
          final_div_factor: 1e1
        log_dir: ${exp_dir}
    pretty_name: "HolUE"


  - embeddings: scf
    gallery_template_pooling_strategy:
      _target_: evaluation.template_pooling_strategies.PoolingDefault
    probe_template_pooling_strategy:
      _target_: evaluation.template_pooling_strategies.PoolingDefault
    recognition_method:
      _target_: evaluation.open_set_methods.score_function_based.SimilarityBasedPrediction
      distance_function: 
        _target_: evaluation.distance_functions.open_set_identification.CosineSim
      acceptance_score: 
        _target_: evaluation.confidence_functions.MaxSimilarity_confidence
      uncertainty_function:
        _target_: evaluation.open_set_methods.uncertainty_functions.RandomScore
      alpha: 0
    pretty_name: "Random"


  - embeddings: scf
    gallery_template_pooling_strategy:
      _target_: evaluation.template_pooling_strategies.PoolingDefault
    probe_template_pooling_strategy:
      _target_: evaluation.template_pooling_strategies.PoolingDefault
    recognition_method:
      _target_: evaluation.open_set_methods.score_function_based.SimilarityBasedPrediction
      distance_function: 
        _target_: evaluation.distance_functions.open_set_identification.CosineSim
      acceptance_score: 
        _target_: evaluation.confidence_functions.MaxSimilarity_confidence
      uncertainty_function:
        _target_: evaluation.open_set_methods.uncertainty_functions.OracleScore
      alpha: 0
      oracle_predictions: True
    pretty_name: "Oracle"



