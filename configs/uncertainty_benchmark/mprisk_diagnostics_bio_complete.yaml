hydra:
  run:
    dir: ${exp_dir}

seed: 777
deterministic: true

exp_dir: outputs/experiments/mprisk_diagnostics_bio_complete

use_two_galleries: False
recompute_template_pooling: False

rejection_fractions: [0.0, 0.5, 20]

beta_list: [0.5]

# We compute a superset of operating points.
# Tables can later select only:
#   IJB-C/IJB-B/Whale: [0.05, 0.1, 0.2]
#   VoxBlink: [0.01, 0.05, 0.1]
far_list: [0.01, 0.05, 0.1, 0.2]


# ---------------------------------------------------------------------
# Datasets
# ---------------------------------------------------------------------

test_datasets:
  - _target_: evaluation.test_datasets.FaceRecogntionDataset
    dataset_name: IJBC
    dataset_path: /app/datasets/arcface_ijb/IJBC

  - _target_: evaluation.test_datasets.FaceRecogntionDataset
    dataset_name: IJBB
    dataset_path: /app/datasets/arcface_ijb/IJBB

  - _target_: evaluation.test_datasets.FaceRecogntionDataset
    dataset_name: whale
    dataset_path: /app/datasets/whale

  - _target_: evaluation.test_datasets.FaceRecogntionDataset
    dataset_name: large_12k-perspk5
    dataset_path: /app/datasets/vb-clean_ident/Large_12k/perspk5


# ---------------------------------------------------------------------
# Calibration sets
# ---------------------------------------------------------------------

calibration_sets:
  ijb_val:
    _target_: evaluation.test_datasets.FaceRecogntionDataset
    dataset_name: ms1m
    dataset_path: /app/datasets/ms1m_ident

  voxblink_val:
    _target_: evaluation.test_datasets.FaceRecogntionDataset
    dataset_name: medium_1.2k-perspk5
    dataset_path: /app/datasets/vb-clean_ident/Medium_1.2k/perspk5

  whale_val:
    _target_: evaluation.test_datasets.FaceRecogntionDataset
    dataset_name: whale_val
    dataset_path: /app/datasets/whale_val


dataset_name_to_calibration_set:
  IJBB: ${calibration_sets.ijb_val}
  IJBC: ${calibration_sets.ijb_val}
  whale: ${calibration_sets.whale_val}
  large_12k-perspk5: ${calibration_sets.voxblink_val}


dataset_name_to_T_scale:
  IJBB: 7
  IJBC: 7
  whale: 20
  large_12k-perspk5: 20


# ---------------------------------------------------------------------
# Methods
# ---------------------------------------------------------------------

open_set_identification_methods:

  # -------------------------------------------------------------------
  # HolUE baseline
  # -------------------------------------------------------------------

  - embeddings: scf
    gallery_template_pooling_strategy:
      _target_: evaluation.template_pooling_strategies.PoolingDefault
    probe_template_pooling_strategy:
      _target_: evaluation.template_pooling_strategies.PoolingDefault
    use_detector_score: False
    recognition_method:
      _target_: evaluation.open_set_methods.class_prob_models.MonteCarloPredictiveProb
      gallery_prior: power
      emb_unc_model: vMF
      beta: 0.5
      alpha: 0.5
      predict_T: 20
      M: 0
      pred_uncertainty_type: entropy
      far: null
      calibration_set: True
      calibration_embs_name: scf
      calibration_transform:
        _target_: evaluation.open_set_methods.calibration_methods.NNcalibration
        model:
          _target_: evaluation.open_set_methods.calibration_methods.ExpTransform
          use_shift: True
          use_alpha: True
        lr: 0.001
        epochs: 2000
        weight: 0
        use_norm: True
        balanced_loss: True
        weight_loss_types: False
        train_weight: False
        weight_decay: 0.001
        normalize_kl_by_test: False
        scheduler_params:
          max_lr: 1e-3
          steps_per_epoch: 1
          div_factor: 1e1
          final_div_factor: 1e1
        log_dir: ${exp_dir}
    pretty_name: "HolUE"


  # -------------------------------------------------------------------
  # MPRisk raw
  # -------------------------------------------------------------------

  - embeddings: scf
    gallery_template_pooling_strategy:
      _target_: evaluation.template_pooling_strategies.PoolingDefault
    probe_template_pooling_strategy:
      _target_: evaluation.template_pooling_strategies.PoolingDefault
    use_detector_score: False
    recognition_method:
      _target_: evaluation.open_set_methods.class_prob_models.MPRiskPredictiveProb
      gallery_prior: power
      emb_unc_model: vMF
      beta: 0.5
      predict_T: 20
      M: 0
      far: null

      lambda_fa: 1.0
      lambda_id: 1.0
      lambda_fr: 1.0
      lambda_ns: 1.0

      nonspecificity_mode: analytic_vmf
      tune_lambdas: False
      use_calibration: False
    pretty_name: "MPRisk raw"


  # -------------------------------------------------------------------
  # MPRisk without mixed-prior non-specificity
  # -------------------------------------------------------------------

  - embeddings: scf
    gallery_template_pooling_strategy:
      _target_: evaluation.template_pooling_strategies.PoolingDefault
    probe_template_pooling_strategy:
      _target_: evaluation.template_pooling_strategies.PoolingDefault
    use_detector_score: False
    recognition_method:
      _target_: evaluation.open_set_methods.class_prob_models.MPRiskPredictiveProb
      gallery_prior: power
      emb_unc_model: vMF
      beta: 0.5
      predict_T: 20
      M: 0
      far: null

      lambda_fa: 1.0
      lambda_id: 1.0
      lambda_fr: 1.0
      lambda_ns: 0.0

      nonspecificity_mode: analytic_vmf
      tune_lambdas: False
      use_calibration: False
    pretty_name: "MPRisk no NS"


  # -------------------------------------------------------------------
  # MPRisk tuned on validation
  # -------------------------------------------------------------------

  - embeddings: scf
    gallery_template_pooling_strategy:
      _target_: evaluation.template_pooling_strategies.PoolingDefault
    probe_template_pooling_strategy:
      _target_: evaluation.template_pooling_strategies.PoolingDefault
    use_detector_score: False
    recognition_method:
      _target_: evaluation.open_set_methods.class_prob_models.MPRiskPredictiveProb
      gallery_prior: power
      emb_unc_model: vMF
      beta: 0.5
      predict_T: 20
      M: 0
      far: null

      lambda_fa: 1.0
      lambda_id: 1.0
      lambda_fr: 1.0
      lambda_ns: 1.0

      nonspecificity_mode: analytic_vmf

      tune_lambdas: True
      lambda_search_steps: 4096
      lambda_search_log_low: -10.0
      lambda_search_log_high: 10.0
      lambda_tune_fraction_max: 0.5
      lambda_tune_fraction_num: 20
      lambda_tune_seed: 777

      use_calibration: False
      calibration_set: True
      calibration_embs_name: scf
    pretty_name: "MPRisk"


  # -------------------------------------------------------------------
  # MPRisk tuned + scalar calibration
  # -------------------------------------------------------------------

  - embeddings: scf
    gallery_template_pooling_strategy:
      _target_: evaluation.template_pooling_strategies.PoolingDefault
    probe_template_pooling_strategy:
      _target_: evaluation.template_pooling_strategies.PoolingDefault
    use_detector_score: False
    recognition_method:
      _target_: evaluation.open_set_methods.class_prob_models.MPRiskPredictiveProb
      gallery_prior: power
      emb_unc_model: vMF
      beta: 0.5
      predict_T: 20
      M: 0
      far: null

      lambda_fa: 1.0
      lambda_id: 1.0
      lambda_fr: 1.0
      lambda_ns: 1.0

      nonspecificity_mode: analytic_vmf

      tune_lambdas: True
      lambda_search_steps: 4096
      lambda_search_log_low: -10.0
      lambda_search_log_high: 10.0
      lambda_tune_fraction_max: 0.5
      lambda_tune_fraction_num: 20
      lambda_tune_seed: 777

      use_calibration: True
      calibration_feature_mode: scalar
      calibration_set: True
      calibration_embs_name: scf
      calibration_transform:
        _target_: evaluation.open_set_methods.calibration_methods.ScalarRiskCalibration
        lr: 0.01
        epochs: 1000
        weight_decay: 0.0
        balanced_loss: True
        normalize_kl_by_test: False
        use_norm: True
        min_slope: 1e-6
        log_dir: ${exp_dir}
        verbose: False
    pretty_name: "MPRisk cal"


# ---------------------------------------------------------------------
# Diagnostics experiments
# ---------------------------------------------------------------------

mixed_prior_necessity:
  enabled: True

  # Applies to:
  #   MPRisk raw
  #   MPRisk no NS
  #   MPRisk
  #   MPRisk cal
  method_filter: "MPRisk"


reliability:
  enabled: True
  num_bins: 20

  # Only probability-like methods.
  # HolUE and MPRisk cal both return predicted_unc = -P(correct).
  methods:
    - "HolUE"
    - "MPRisk cal"


bootstrap:
  enabled: True

  # Use 100 for quick debugging, 1000 for final paper.
  num_bootstrap: 1000

  pairs:
    # ---------------------------------------------------------------
    # Main MPRisk vs HolUE comparisons
    # ---------------------------------------------------------------

    - dataset: IJBC
      far: 0.05
      beta: 0.5
      method_a: "MPRisk"
      method_b: "HolUE"

    - dataset: IJBB
      far: 0.05
      beta: 0.5
      method_a: "MPRisk"
      method_b: "HolUE"

    - dataset: whale
      far: 0.1
      beta: 0.5
      method_a: "MPRisk"
      method_b: "HolUE"

    - dataset: large_12k-perspk5
      far: 0.05
      beta: 0.5
      method_a: "MPRisk"
      method_b: "HolUE"


    # ---------------------------------------------------------------
    # Tuned+calibrated MPRisk vs HolUE
    # ---------------------------------------------------------------

    - dataset: IJBC
      far: 0.05
      beta: 0.5
      method_a: "MPRisk cal"
      method_b: "HolUE"

    - dataset: IJBB
      far: 0.05
      beta: 0.5
      method_a: "MPRisk cal"
      method_b: "HolUE"

    - dataset: whale
      far: 0.1
      beta: 0.5
      method_a: "MPRisk cal"
      method_b: "HolUE"

    - dataset: large_12k-perspk5
      far: 0.05
      beta: 0.5
      method_a: "MPRisk cal"
      method_b: "HolUE"


    # ---------------------------------------------------------------
    # Ablation comparisons
    # ---------------------------------------------------------------

    - dataset: IJBC
      far: 0.05
      beta: 0.5
      method_a: "MPRisk"
      method_b: "MPRisk raw"

    - dataset: IJBC
      far: 0.05
      beta: 0.5
      method_a: "MPRisk"
      method_b: "MPRisk no NS"

    - dataset: whale
      far: 0.1
      beta: 0.5
      method_a: "MPRisk"
      method_b: "MPRisk raw"

    - dataset: whale
      far: 0.1
      beta: 0.5
      method_a: "MPRisk"
      method_b: "MPRisk no NS"


qualitative:
  enabled: True

  top_k_per_group: 10
  num_nearest_gallery: 5

  methods:
    - dataset: IJBC
      method: "MPRisk"
      far: 0.05
      beta: 0.5

    - dataset: IJBC
      method: "MPRisk raw"
      far: 0.05
      beta: 0.5

    - dataset: IJBC
      method: "HolUE"
      far: 0.05
      beta: 0.5

    - dataset: whale
      method: "MPRisk"
      far: 0.1
      beta: 0.5

    - dataset: whale
      method: "MPRisk raw"
      far: 0.1
      beta: 0.5

    - dataset: whale
      method: "HolUE"
      far: 0.1
      beta: 0.5

    - dataset: large_12k-perspk5
      method: "MPRisk"
      far: 0.05
      beta: 0.5

    - dataset: large_12k-perspk5
      method: "HolUE"
      far: 0.05
      beta: 0.5


# ---------------------------------------------------------------------
# Optional embedding-quality stress test
# ---------------------------------------------------------------------

quality_stress:
  enabled: False

  fars: [0.05, 0.1]
  kappa_input_scales: [0.25, 0.5, 1.0, 2.0, 5.0]


quality_stress_base_method:
  embeddings: scf
  gallery_template_pooling_strategy:
    _target_: evaluation.template_pooling_strategies.PoolingDefault
  probe_template_pooling_strategy:
    _target_: evaluation.template_pooling_strategies.PoolingDefault
  use_detector_score: False
  recognition_method:
    _target_: evaluation.open_set_methods.class_prob_models.MPRiskPredictiveProb

    gallery_prior: power
    emb_unc_model: vMF
    beta: 0.5
    predict_T: 20
    M: 0
    far: null

    lambda_fa: 1.0
    lambda_id: 1.0
    lambda_fr: 1.0
    lambda_ns: 1.0

    nonspecificity_mode: analytic_vmf

    tune_lambdas: False
    use_calibration: False

    calibration_set: True
    calibration_embs_name: scf
  pretty_name: "MPRisk quality stress"