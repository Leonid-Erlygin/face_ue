hydra:
  run:
    dir: ${exp_dir}

exp_dir: outputs/latex_tables_new_paper_bio_diagnostics
round_num: 2

paths:
  core_tables: /app/outputs/experiments/mprisk_core_bio_complete/tables
  tuning_tables: /app/outputs/experiments/mprisk_tuning_bio_complete/tables
  diagnostics_tables: /app/outputs/experiments/mprisk_diagnostics_bio_complete/tables
  diagnostics_reliability_bins: /app/outputs/experiments/mprisk_diagnostics_bio_complete/tables/reliability_bins


pretty_name:
  dataset:
    IJBC: "IJB-C"
    IJBB: "IJB-B"
    whale: "Whale"
    large_12k-perspk5: "VB-Eval-L-5"

  model:
    SCF: "SCF"
    AccScr: "AccScr"
    MSP: "MSP"
    Margin: "Margin"
    GalUE: "GalUE"
    HolUE: "HolUE"
    "MPRisk raw": "MPRisk raw"
    "MPRisk no NS": "MPRisk no $r_{NS}$"
    "MPRisk": "MPRisk"
    "MPRisk cal": "MPRisk cal"
    Random: "Random"
    Oracle: "Oracle"

  target:
    any_error: "Any error"
    false_accept: "FA"
    false_reject: "FR"
    misidentification: "ID"

  variant:
    "FA only": "$r_{FA}$"
    "ID only": "$r_{ID}$"
    "FR only": "$r_{FR}$"
    "NS only": "$r_{NS}$"
    "ordinary equal": "$r_{FA}+r_{ID}+r_{FR}$"
    "full equal": "Equal full"
    "MPRisk current": "MPRisk current"

    collapsed_unknown_risk: "Collapsed unknown"
    ordinary_risk_no_NS: "No $r_{NS}$"
    equal_full_risk: "Equal full"
    MPRisk_current: "MPRisk"
    r_FA: "$r_{FA}$"
    r_ID: "$r_{ID}$"
    r_FR: "$r_{FR}$"
    r_NS: "$r_{NS}$"
    unknown_nonspecificity: "$\\mathcal{N}_0$"

    T_7: "$T=7$"
    T_10: "$T=10$"
    T_20: "$T=20$"
    T_30: "$T=30$"
    T_50: "$T=50$"
    kappa_input_0.5: "$s_{\\kappa}=0.5$"
    kappa_input_1: "$s_{\\kappa}=1$"
    kappa_input_2: "$s_{\\kappa}=2$"

  column:
    prr_f1: "PRR $F_1$"
    test_prr_f1: "Test PRR"
    val_prr: "Val. PRR"
    test_prr_f1_mean: "Test PRR"
    val_prr_mean: "Val. PRR"

    auroc: "AUROC"
    auprc: "AUPRC"
    error_auroc: "Error AUROC"
    error_auprc: "Error AUPRC"
    any_error_auroc: "Any AUROC"
    false_accept_auroc: "FA AUROC"
    false_reject_auroc: "FR AUROC"
    misidentification_auroc: "ID AUROC"

    spearman: "Spearman"
    rank_inversion_rate: "Inv. rate"
    kl_error_auroc: "KL AUROC"
    kl_error_auprc: "KL AUPRC"

    ece: "ECE"
    brier: "Brier"
    nll: "NLL"

    elapsed_ms_per_probe: "ms/probe"
    elapsed_sec_total: "Total sec."

    lambda_fa: "$\\lambda_{FA}$"
    lambda_id: "$\\lambda_{ID}$"
    lambda_fr: "$\\lambda_{FR}$"
    lambda_ns: "$\\lambda_{NS}$"


metric_order:
  prr_f1: high
  test_prr_f1: high
  val_prr: high
  test_prr_f1_mean: high
  val_prr_mean: high

  auroc: high
  auprc: high
  error_auroc: high
  error_auprc: high
  any_error_auroc: high
  false_accept_auroc: high
  false_reject_auroc: high
  misidentification_auroc: high

  spearman: high
  rank_inversion_rate: low
  kl_error_auroc: high
  kl_error_auprc: high

  ece: low
  brier: low
  nll: low

  elapsed_ms_per_probe: low
  elapsed_sec_total: low


tables:

  error_type_detection_ijbc:
    enabled: True
    type: error_type_detection
    input_path: ${paths.core_tables}/error_type_detection.csv
    caption: >
      Error-type detection quality on IJB-C at FPIR $0.05$.
    label: "tab:error_type_detection_ijbc"
    placement: t
    table_size: footnotesize
    tabcolsep: 4
    use_adjustbox: False
    round_num: 2
    highlight_best: True
    dataset: IJBC
    far: 0.05
    beta: 0.5
    metric: auroc
    exclude_from_best: [Random, Oracle]
    methods:
      - SCF
      - AccScr
      - MSP
      - GalUE
      - HolUE
      - "MPRisk raw"
      - "MPRisk"
      - "MPRisk cal"
    targets:
      - any_error
      - false_accept
      - false_reject
      - misidentification

  error_type_detection_whale:
    enabled: True
    type: error_type_detection
    input_path: ${paths.core_tables}/error_type_detection.csv
    caption: >
      Error-type detection quality on Whale at FPIR $0.1$.
    label: "tab:error_type_detection_whale"
    placement: t
    table_size: footnotesize
    tabcolsep: 4
    use_adjustbox: False
    round_num: 2
    highlight_best: True
    dataset: whale
    far: 0.1
    beta: 0.5
    metric: auroc
    exclude_from_best: [Random, Oracle]
    methods:
      - SCF
      - AccScr
      - MSP
      - GalUE
      - HolUE
      - "MPRisk raw"
      - "MPRisk"
      - "MPRisk cal"
    targets:
      - any_error
      - false_accept
      - false_reject
      - misidentification

  component_ablation_ijbc:
    enabled: True
    type: component_ablation
    input_path: ${paths.core_tables}/mprisk_component_ablation.csv
    caption: >
      MPRisk component ablation on IJB-C at FPIR $0.05$.
    label: "tab:component_ablation_ijbc"
    placement: t
    table_size: footnotesize
    tabcolsep: 4
    use_adjustbox: False
    round_num: 2
    highlight_best: True
    dataset: IJBC
    source_method: "MPRisk"
    far: 0.05
    beta: 0.5
    variants:
      - "FA only"
      - "ID only"
      - "FR only"
      - "NS only"
      - "ordinary equal"
      - "full equal"
      - "MPRisk current"
    metrics:
      - prr_f1
      - error_auroc
      - error_auprc
    directions:
      prr_f1: high
      error_auroc: high
      error_auprc: high

  component_ablation_whale:
    enabled: True
    type: component_ablation
    input_path: ${paths.core_tables}/mprisk_component_ablation.csv
    caption: >
      MPRisk component ablation on Whale at FPIR $0.1$.
    label: "tab:component_ablation_whale"
    placement: t
    table_size: footnotesize
    tabcolsep: 4
    use_adjustbox: False
    round_num: 2
    highlight_best: True
    dataset: whale
    source_method: "MPRisk"
    far: 0.1
    beta: 0.5
    variants:
      - "FA only"
      - "ID only"
      - "FR only"
      - "NS only"
      - "ordinary equal"
      - "full equal"
      - "MPRisk current"
    metrics:
      - prr_f1
      - error_auroc
      - error_auprc

  kl_rank_inversion_ijbc:
    enabled: True
    type: kl_inversion
    input_path: ${paths.core_tables}/kl_rank_inversion.csv
    caption: >
      Empirical disagreement between KL uncertainty and operational risk on IJB-C.
    label: "tab:kl_rank_inversion_ijbc"
    placement: t
    table_size: footnotesize
    tabcolsep: 4
    use_adjustbox: False
    round_num: 2
    highlight_best: True
    dataset: IJBC
    far: 0.05
    beta: 0.5
    kl_reference: empirical_error
    methods:
      - HolUE
      - "MPRisk raw"
      - "MPRisk"
      - "MPRisk cal"
    metrics:
      - spearman
      - rank_inversion_rate
      - kl_error_auroc
      - kl_error_auprc
    directions:
      spearman: high
      rank_inversion_rate: low
      kl_error_auroc: high
      kl_error_auprc: high

  mixed_prior_necessity_ijbc:
    enabled: True
    type: mixed_prior_necessity
    input_path: ${paths.diagnostics_tables}/mixed_prior_necessity.csv
    caption: >
      Mixed-prior necessity ablation on IJB-C at FPIR $0.05$.
    label: "tab:mixed_prior_necessity_ijbc"
    placement: t
    table_size: footnotesize
    tabcolsep: 4
    use_adjustbox: False
    round_num: 2
    highlight_best: True
    dataset: IJBC
    source_method: "MPRisk"
    far: 0.05
    beta: 0.5
    variants:
      - collapsed_unknown_risk
      - ordinary_risk_no_NS
      - equal_full_risk
      - MPRisk_current
      - r_NS
      - unknown_nonspecificity
    metrics:
      - prr_f1
      - false_reject_auroc
      - any_error_auroc

  mixed_prior_necessity_whale:
    enabled: True
    type: mixed_prior_necessity
    input_path: ${paths.diagnostics_tables}/mixed_prior_necessity.csv
    caption: >
      Mixed-prior necessity ablation on Whale at FPIR $0.1$.
    label: "tab:mixed_prior_necessity_whale"
    placement: t
    table_size: footnotesize
    tabcolsep: 4
    use_adjustbox: False
    round_num: 2
    highlight_best: True
    dataset: whale
    source_method: "MPRisk"
    far: 0.1
    beta: 0.5
    variants:
      - collapsed_unknown_risk
      - ordinary_risk_no_NS
      - equal_full_risk
      - MPRisk_current
      - r_NS
      - unknown_nonspecificity
    metrics:
      - prr_f1
      - false_reject_auroc
      - any_error_auroc

  reliability_ijbc:
    enabled: True
    type: reliability
    input_path: ${paths.diagnostics_tables}/reliability_metrics.csv
    caption: >
      Calibration quality on IJB-C at FPIR $0.05$.
    label: "tab:reliability_ijbc"
    placement: t
    table_size: footnotesize
    tabcolsep: 4
    use_adjustbox: False
    round_num: 3
    highlight_best: True
    dataset: IJBC
    far: 0.05
    beta: 0.5
    methods:
      - HolUE
      - "MPRisk cal"
    metrics:
      - ece
      - brier
      - nll
      - error_auroc
      - error_auprc
    directions:
      ece: low
      brier: low
      nll: low
      error_auroc: high
      error_auprc: high

  reliability_whale:
    enabled: True
    type: reliability
    input_path: ${paths.diagnostics_tables}/reliability_metrics.csv
    caption: >
      Calibration quality on Whale at FPIR $0.1$.
    label: "tab:reliability_whale"
    placement: t
    table_size: footnotesize
    tabcolsep: 4
    use_adjustbox: False
    round_num: 3
    highlight_best: True
    dataset: whale
    far: 0.1
    beta: 0.5
    methods:
      - HolUE
      - "MPRisk cal"
    metrics:
      - ece
      - brier
      - nll
      - error_auroc
      - error_auprc

  validation_size_ijbc:
    enabled: True
    type: validation_size
    input_path: ${paths.tuning_tables}/validation_size_ablation_summary.csv
    caption: >
      Validation-size ablation for MPRisk lambda tuning on IJB-C at FPIR $0.05$.
    label: "tab:validation_size_ijbc"
    placement: t
    table_size: footnotesize
    tabcolsep: 4
    use_adjustbox: False
    round_num: 2
    dataset: IJBC
    variant: MPRisk
    far: 0.05
    beta: 0.5

  operating_point_transfer_ijbc:
    enabled: True
    type: operating_point_transfer
    input_path: ${paths.tuning_tables}/operating_point_transfer.csv
    caption: >
      Operating-point transfer of MPRisk lambda weights on IJB-C.
    label: "tab:operating_transfer_ijbc"
    placement: t
    table_size: footnotesize
    tabcolsep: 4
    use_adjustbox: False
    round_num: 2
    highlight_best: True
    dataset: IJBC
    variant: MPRisk
    beta: 0.5
    metric: test_prr_f1

  hyperparameter_sensitivity_ijbc:
    enabled: True
    type: hyperparameter_sensitivity
    input_path: ${paths.tuning_tables}/hyperparameter_sensitivity.csv
    caption: >
      MPRisk hyperparameter sensitivity on IJB-C at FPIR $0.05$.
    label: "tab:hyperparam_ijbc"
    placement: t
    table_size: scriptsize
    tabcolsep: 3
    use_adjustbox: True
    adjustbox_width: '\textwidth'
    round_num: 2
    highlight_best: True
    dataset: IJBC
    far: 0.05
    beta: 0.5
    sort_by: test_prr_f1
    sort_direction: high
    metrics:
      - test_prr_f1
      - val_prr
      - lambda_fa
      - lambda_id
      - lambda_fr
      - lambda_ns

  bootstrap_bio:
    enabled: True
    type: bootstrap
    input_path: ${paths.diagnostics_tables}/bootstrap_prr_differences.csv
    caption: >
      Paired bootstrap confidence intervals for PRR differences on biometric and audio benchmarks.
    label: "tab:bootstrap_bio"
    placement: t
    table_size: footnotesize
    tabcolsep: 3
    use_adjustbox: True
    adjustbox_width: '\textwidth'
    round_num: 2
    selectors: {}

  runtime_ijbc:
    enabled: True
    type: runtime
    input_path: ${paths.diagnostics_tables}/runtime_overhead.csv
    caption: >
      Runtime overhead on IJB-C at FPIR $0.05$.
    label: "tab:runtime_ijbc"
    placement: t
    table_size: footnotesize
    tabcolsep: 4
    use_adjustbox: False
    round_num: 2
    highlight_best: False
    dataset: IJBC
    far: 0.05
    beta: 0.5
    methods:
      - HolUE
      - "MPRisk raw"
      - "MPRisk"
      - "MPRisk cal"
    metrics:
      - elapsed_ms_per_probe
      - elapsed_sec_total

  runtime_whale:
    enabled: True
    type: runtime
    input_path: ${paths.diagnostics_tables}/runtime_overhead.csv
    caption: >
      Runtime overhead on Whale at FPIR $0.1$.
    label: "tab:runtime_whale"
    placement: t
    table_size: footnotesize
    tabcolsep: 4
    use_adjustbox: False
    round_num: 2
    highlight_best: False
    dataset: whale
    far: 0.1
    beta: 0.5
    methods:
      - HolUE
      - "MPRisk raw"
      - "MPRisk"
      - "MPRisk cal"
    metrics:
      - elapsed_ms_per_probe
      - elapsed_sec_total


figures:

  calibration_ijbc:
    enabled: True
    type: calibration_diagram
    input_dir: ${paths.diagnostics_reliability_bins}
    dataset: IJBC
    far: 0.05
    beta: 0.5
    methods:
      - HolUE
      - MPRisk cal
    figsize: [5.2, 5.2]

  calibration_whale:
    enabled: True
    type: calibration_diagram
    input_dir: ${paths.diagnostics_reliability_bins}
    dataset: whale
    far: 0.1
    beta: 0.5
    methods:
      - HolUE
      - MPRisk cal
    figsize: [5.2, 5.2]