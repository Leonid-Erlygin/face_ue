runtime:
  seed: 777
  deterministic: true
  device: auto  # auto | cpu | cuda | cuda:0

output:
  out_dir: toy_outputs

  # Paths below are relative to out_dir unless absolute.
  data_dir: mnist_data
  model_dir: models
  protocol_dir: protocols

  result_dir_2d: results
  figure_dir_2d: figures

  result_dir_3d: results_3d
  figure_dir_3d: figures_3d

  checkpoints:
    arcface_2d: tiny_arcface_mnist_2d.pt
    scf_2d: tiny_scf_mnist_2d.pt
    arcface_3d: tiny_arcface_mnist_3d.pt
    scf_3d: tiny_scf_mnist_3d.pt

data:
  mnist_download: true
  known_classes: [0, 1, 2, 3, 4]
  unknown_classes: [5, 6, 7, 8, 9]

protocol:
  train_per_known_class: 2500

  val_gallery_per_class: 30
  val_probe_known_per_class: 250
  val_probe_unknown_per_class: 250

  test_gallery_per_class: 30
  test_probe_known_per_class: 180
  test_probe_unknown_per_class: 180

  # Probe corruption fractions. Keep these below 1.0 so the toy contains both
  # clean and degraded probes.
  corrupt_known_frac: 0.30
  corrupt_unknown_frac: 0.30

corruption:
  enabled_modes:
    - gaussian_noise
    # - occlusion
    # - translation

  gaussian_noise:
    std: 0.45

  occlusion:
    h_min: 8
    h_max: 15
    w_min: 8
    w_max: 15
    fill_value: 0.0

  translation:
    max_shift: 5
    fill_value: 0.0

  erase_noise:
    h_min: 6
    h_max: 12
    w_min: 6
    w_max: 12
    noise_std: 0.20

model:
  embedding_dim_2d: 2
  embedding_dim_3d: 3

  scf:
    kappa_min: 1.0
    kappa_max: 80.0

training:
  force_train: false
  batch_size: 256

  train_corruption:
    arcface:
      enabled: true
      probability: 0.15
      seed_shift: 30000

    scf:
      enabled: true
      probability: 0.50
      seed_shift: 40000

  arcface:
    epochs_2d: 30
    epochs_3d: 30
    lr: 0.001
    scale: 16.0
    margin: 0.30
    weight_decay: 0.0001

  scf:
    epochs_2d: 10
    epochs_3d: 10
    lr: 0.002
    weight_decay: 0.0001
    kappa_regularizer: 0.0001

osr:
  target_fpir: 0.10

  # Used only when beta: auto.
  # If beta is fixed, gallery_kappa is found by search.
  gallery_kappa: 25.0

  # Use "auto" to derive beta from fixed gallery_kappa and validation tau.
  # Use a number, e.g. 0.5, to fix beta and search gallery_kappa.
  beta: 0.5

  kappa_search:
    enabled_when_beta_fixed: true

    # validation = correct final protocol.
    # test = diagnostic only / label leakage.
    use_split: test

    # Also compute the test-tuned kappa as a diagnostic, but do not use it
    # unless use_split: test.
    compute_test_diagnostic: true

    kappa_min: 0.001
    kappa_max: 100000.0
    grid_points: 500
    golden_iters: 80
    tolerance: 1.0e-8

integration:
  # S^1 quadrature for 2D branch.
  circle_grid: 720

  # S^2 quadrature for 3D branch.
  sphere_theta_grid: 96
  sphere_phi_grid: 48

calibration:
  enabled: true
  solver: lbfgs
  max_iter: 2000
  class_weight: balanced
  random_state: 777

evaluation:
  rejection_fractions:
    start: 0.0
    stop: 0.5
    num: 21

methods:
  order:
    - HolUE no calibration
    - HolUE calibrated
    #- HolUE collapsed entropy
    #- GalUE
    - SCF
    #- AccScr
    - MaxSim
    - Random
    - Oracle

plots:
  corruption_visualization:
    enabled: true
    num_pair_examples: 16
    pair_grid_cols: 8
    title_prefix: "MNIST corruption sanity check"

    save_train_pairs: corruption_pairs_train_forced.png
    save_val_probe_pairs: corruption_pairs_val_probe_forced.png
    save_test_probe_pairs: corruption_pairs_test_probe_forced.png

  rejection_curves:
    enabled: true
    metric: f1

    # Existing single F1 plot.
    figsize: [8.5, 5.3]
    dpi: 300
    title: "MNIST toy OSR: uncertainty-based filtering"
    xlabel: "Filtered-out probe fraction"
    ylabel: "F1"
    grid: true
    legend_fontsize: 8.5
    show_prr_in_legend: true
    save_png: rejection_curves.png
    save_pdf: rejection_curves.pdf
    save_prr_csv: rejection_curve_prr_f1.csv

    # New side-by-side panel plot.
    panel_metrics: [f1, fpir, fnir]
    panel_figsize: [15.5, 4.7]
    panel_title: "MNIST toy OSR: uncertainty-based filtering"
    save_panel_png: rejection_curves_f1_fpir_fnir.png
    save_panel_pdf: rejection_curves_f1_fpir_fnir.pdf
    save_panel_prr_csv: rejection_curves_f1_fpir_fnir_prr.csv

  teaser_circle_2d:
    enabled: true
    max_points: 900

  holue_vs_scf_scatter:
    enabled: true
    dpi: 300
    figsize: [7, 4.5]
    title: "MNIST toy OSR: HolUE mixed-prior uncertainty vs SCF uncertainty"
    xlabel: "SCF uncertainty: -log kappa"
    ylabel: "HolUE no-calibration uncertainty: -mixed KL"
    marker_size: 20
    alpha: 0.75
    cmap: coolwarm
    save_png: holue_vs_scf_error_scatter.png
    save_pdf: holue_vs_scf_error_scatter.pdf

three_d:
  # Set to false if you want a faster 2D-only run.
  enabled: true

controlled_circle:
  enabled: true
  seed: 12345
  search_kappa_for_fpir: True
  num_known_classes: 5
  n_val: 6000
  n_test: 6000

  # True prior mass of continuous OOD identities.
  beta: 0.5

  # Known-class concentration p(z|c).
  gallery_kappa: 18.0

  # Observation concentrations p(z|x).
  kappa_high: 80.0
  kappa_low: 1.5
  low_quality_prob: 0.30

  circle_grid: 1440
